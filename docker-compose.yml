services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: launchlab
      POSTGRES_USER: launchlab
      POSTGRES_PASSWORD: launchlab
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
